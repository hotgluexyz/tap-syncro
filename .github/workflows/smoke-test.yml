name: Smoke Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          # The tap's fs dependency still imports pkg_resources.
          pip install "setuptools<81" . hotglue-smoke-test==1.1.8

      - name: Run smoke tests
        run: |
          source .venv/bin/activate
          hotglue-smoke-test run
